[project]
name = "scrape-website"
version = "0.4.0"
description = "Async website scraper that downloads all pages and documents from a domain"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11.11",
    "aiofiles>=24.1.0",
    "aiodns>=3.2.0",
    "lxml>=5.3.0",
    "trafilatura>=2.0.0",
    "playwright>=1.60.0",
    "protego>=0.6.1",
    "aiolimiter>=1.2.1",
    "pymupdf4llm>=1.27.2.3",
    "curl-cffi>=0.7",
    "brotli>=1.2.0",
    "zstandard>=0.25.0",
    "markitdown[docx,pptx,xlsx]>=0.1.6",
    # Reads cf_clearance from the live Chrome cookie store for the cf-clearance
    # bridge (silent path). Optional at runtime — code degrades gracefully if absent
    # and falls back to the SCRAPE_CF_COOKIES file or a --human real-Chrome solve.
    "browser-cookie3>=0.20.1",
]
