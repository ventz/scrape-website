[project]
name = "scrape-website"
version = "0.7.2"
description = "Async website scraper that downloads all pages and documents from a domain"
requires-python = ">=3.13"
# Core: static fetch + link/text extraction + robots politeness. The advanced
# tiers install via extras so library consumers (e.g. scrape-website-mcp) pick
# exactly the capabilities they ship; every extra degrades gracefully when
# absent (import-guarded).
dependencies = [
    "aiohttp>=3.14.3",
    "aiofiles>=25.1.0",
    "aiodns>=4.0.4",
    "lxml>=6.1.3",
    "trafilatura>=2.2.0",
    "protego>=0.7.0",
    "aiolimiter>=1.3.0",
]

[project.optional-dependencies]
# Headless-Chromium render escalation for SPA shells (remember to run
# `uv run playwright install chromium` after installing).
render = ["playwright>=1.63.0"]
# Real-browser TLS fingerprint fallback for 403/WAF/Cloudflare challenges.
waf = [
    "curl-cffi>=0.16.3",
    "brotli>=1.2.0",
    "zstandard>=0.25.0",
]
# PDF / Office document -> Markdown extraction.
docs = [
    "pymupdf4llm>=1.28.2",
    "markitdown[docx,pptx,xlsx]>=0.1.8",
]
# Reads cf_clearance from the live Chrome cookie store for the cf-clearance
# bridge (silent path) — only useful on a workstation with a real Chrome.
human = ["browser-cookie3>=0.20.1"]
all = ["scrape-website[render,waf,docs,human]"]

[dependency-groups]
# The standalone CLI keeps its historical batteries-included behavior:
# `uv sync` installs everything.
dev = [
    "scrape-website[all]",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrape_website"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that hit the network or need Chromium",
]
